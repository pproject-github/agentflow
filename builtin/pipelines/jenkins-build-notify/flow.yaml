instances:
  start:
    definitionId: control_start
    label: Start
    role: normal
    input: []
    output:
      - type: node
        name: next
        value: ""
    body: ""
  job:
    definitionId: provide_str
    label: Jenkins Job
    role: normal
    input: []
    output:
      - type: text
        name: value
        value: ""
    body: ""
  parameters:
    definitionId: provide_str
    label: Build Parameters
    role: normal
    input: []
    output:
      - type: text
        name: value
        value: "{}"
    body: ""
  credential_ref:
    definitionId: provide_str
    label: Credential Ref
    role: normal
    input: []
    output:
      - type: text
        name: value
        value: ""
    body: ""
  webhook_key:
    definitionId: provide_str
    label: WeCom Webhook Key
    role: normal
    input: []
    output:
      - type: text
        name: value
        value: ""
    body: ""
  jenkins_build:
    definitionId: tool_jenkins_build
    label: Jenkins Build
    role: normal
    input:
      - type: node
        name: prev
        value: ""
      - type: text
        name: job
        value: ""
      - type: text
        name: parameters
        value: "{}"
      - type: text
        name: credentialRef
        value: ""
      - type: text
        name: pollInterval
        value: "30s"
      - type: text
        name: timeout
        value: "2h"
    output:
      - type: node
        name: next
        value: ""
      - type: text
        name: status
        value: ""
      - type: text
        name: url
        value: ""
      - type: text
        name: qrUrl
        value: ""
    body: ""
  format_notification:
    definitionId: tool_nodejs
    label: Format Build Notification
    role: normal
    input:
      - type: node
        name: prev
        value: ""
      - type: text
        name: status
        value: ""
      - type: text
        name: url
        value: ""
      - type: text
        name: qrUrl
        value: ""
    output:
      - type: node
        name: next
        value: ""
      - type: text
        name: markdown
        value: ""
    script: >-
      node -e "const fs=require('fs');const [status,url,qr,out]=process.argv.slice(1);const lines=['## Jenkins 构建结果','> 状态：'+status];if(url)lines.push('[查看构建或产物]('+url+')');if(qr)lines.push('[查看二维码]('+qr+')');fs.writeFileSync(out,lines.join('\n\n'));" ${status} ${url} ${qrUrl} ${markdown}
    body: ""
  notify:
    definitionId: tool_wecom_send_group_markdown
    label: WeCom Notification
    role: normal
    input:
      - type: node
        name: prev
        value: ""
      - type: text
        name: markdown
        value: ""
      - type: text
        name: webhookUrl
        value: ""
      - type: text
        name: webhookKey
        value: ""
    output:
      - type: node
        name: next
        value: ""
      - type: bool
        name: sent
        value: ""
      - type: text
        name: message
        value: ""
      - type: text
        name: response
        value: ""
    body: ""
  end:
    definitionId: control_end
    label: End
    role: normal
    input:
      - type: node
        name: prev
        value: ""
    output: []
    body: ""
